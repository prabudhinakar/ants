<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ants Playing the Web</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3f1606; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Ants Playing the Web. Five ants live on the server and wander the page and the nest.
// This page only watches: it draws what the server says.
const RED = '#7a2e12', EARTH = '#3f1606', LIGHT = '#f6dfd2';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, sc = 1, ox = 0, oy = 0;

let cfg = null;                 // layout and settings from the server
let texts = [], hidden = [], rooms = [];
let ants = new Map();           // id -> drawn ant (smoothed)
let trails = [], marks = [];
let clockOffset = 0;
let tunnelEdge, tunnelFill, roomLayer, grain, roomsDirty = true;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  if (cfg) { sc = Math.min(W / cfg.W, H / cfg.H); ox = (W - cfg.W * sc) / 2; oy = (H - cfg.H * sc) / 2; }
}
addEventListener('resize', resize);
resize();

// ---------- layers ----------
function layer(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function makeGrain() {
  const g = layer(256, 256), x = g.getContext('2d'), d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() < 0.5 ? 0 : 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = Math.random() * 9; }
  x.putImageData(d, 0, 0);
  return ctx.createPattern(g, 'repeat');
}
function stamp(s) {
  const e = tunnelEdge.getContext('2d'), f = tunnelFill.getContext('2d');
  e.fillStyle = '#2b1004'; e.beginPath(); e.arc(s[0] - cfg.split, s[1], 19, 0, 7); e.fill();
  f.fillStyle = '#5b2a12'; f.beginPath(); f.arc(s[0] - cfg.split, s[1], 14, 0, 7); f.fill();
}

function drawRooms() {
  const g = roomLayer.getContext('2d');
  g.clearRect(0, 0, roomLayer.width, roomLayer.height);
  const R = cfg.roomR;
  for (const r of rooms) {
    if (!r.room || !r.room.items.length) continue;
    const t = layer(roomLayer.width, roomLayer.height), tx = t.getContext('2d');
    tx.fillStyle = r.c;
    for (const it of r.room.items) { tx.beginPath(); tx.arc(it.x - cfg.split, it.y, R + 3, 0, 7); tx.fill(); }
    tx.globalCompositeOperation = 'destination-out';
    for (const it of r.room.items) { tx.beginPath(); tx.arc(it.x - cfg.split, it.y, R, 0, 7); tx.fill(); }
    g.globalAlpha = 0.6; g.drawImage(t, 0, 0);                 // the boundary
    const f = layer(roomLayer.width, roomLayer.height), fx = f.getContext('2d');
    fx.fillStyle = r.c;
    for (const it of r.room.items) { fx.beginPath(); fx.arc(it.x - cfg.split, it.y, R, 0, 7); fx.fill(); }
    g.globalAlpha = 0.11; g.drawImage(f, 0, 0);                // the lighter floor
    g.globalAlpha = 1;
    g.fillStyle = LIGHT; g.font = '14px Helvetica, Arial, sans-serif'; g.textAlign = 'center';
    for (const it of r.room.items) { g.save(); g.translate(it.x - cfg.split, it.y); g.rotate(it.r); g.fillText(it.t, 0, 4); g.restore(); }
  }
  roomsDirty = false;
}

// ---------- network ----------
function onInit(m) {
  cfg = m;
  clockOffset = cfg.t - Date.now();
  trails = cfg.trails; marks = cfg.marks;
  tunnelEdge = layer(cfg.W - cfg.split, cfg.H); tunnelFill = layer(cfg.W - cfg.split, cfg.H);
  roomLayer = layer(cfg.W - cfg.split, cfg.H);
  const nh = cfg.nestHole;
  stamp([nh.x, nh.y]); for (let a = 0; a < 7; a += 0.7) stamp([nh.x + Math.cos(a) * 24, nh.y + Math.sin(a) * 24]);
  for (const s of cfg.tunnels) stamp(s);
  grain = makeGrain(); resize();
}
function onWorld(w) { texts = w.texts; hidden = w.hidden; rooms = w.rooms; roomsDirty = true; }
function onTick(m) {
  if (!cfg) return;
  clockOffset = m.t - Date.now();
  for (const s of m.nt) stamp(s);
  trails.push(...m.nr); marks.push(...m.nm);
  for (const v of m.ants) {
    let a = ants.get(v.id);
    if (!a) { a = { ...v, dx: v.x, dy: v.y, da: v.a, phase: Math.random() * 6 }; ants.set(v.id, a); }
    Object.assign(a, { c: v.c, s: v.s, tx: v.x, ty: v.y, ta: v.a, al: v.al, k: v.k, p: v.p });
  }
}
function connect() {
  if (location.search.includes('still')) {            // one still picture, for screenshots (blocks the page load)
    const x = new XMLHttpRequest(); x.open('GET', 'snapshot', false); x.send();
    const m = JSON.parse(x.responseText); onInit(m.init); onWorld(m.world); onTick(m.tick); window.__stop = true;
    return;
  }
  const es = new EventSource('events');
  es.addEventListener('init', e => onInit(JSON.parse(e.data)));
  es.addEventListener('world', e => onWorld(JSON.parse(e.data)));
  es.addEventListener('tick', e => onTick(JSON.parse(e.data)));
}

// ---------- drawing ----------
const now = () => Date.now() + clockOffset;

function drawPageWords() {
  ctx.fillStyle = RED; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < cfg.words.length; i++) {
    if (hidden[i]) continue;
    const w = cfg.words[i];
    ctx.font = (w.size > 30 ? 'bold ' : '') + w.size + 'px Helvetica, Arial, sans-serif';
    ctx.fillText(texts[i], w.x, w.y, w.w);
  }
  ctx.font = '11px Helvetica, Arial, sans-serif'; ctx.fillText(cfg.credit, 60, 878);
}

function drawDots(space, t) {
  for (const d of trails) {
    if (d[3] !== space) continue;
    const k = 1 - (t - d[2]) / cfg.trailTtl; if (k <= 0) continue;
    ctx.fillStyle = space ? `rgba(246,223,210,${0.28 * k})` : `rgba(122,46,18,${0.3 * k})`;
    ctx.beginPath(); ctx.arc(d[0], d[1], 2.2, 0, 7); ctx.fill();
  }
  for (const d of marks) {
    if (d[3] !== space) continue;
    const k = 1 - (t - d[2]) / cfg.scentTtl; if (k <= 0) continue;
    const col = (ants.get(d[4]) || {}).c || LIGHT;
    ctx.globalAlpha = 0.65 * k; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(d[0], d[1], 4.5, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
}

function drawAnt(a) {
  const nest = a.s === 1;
  ctx.save(); ctx.globalAlpha = Math.max(0, a.al);
  ctx.translate(a.dx, a.dy);
  if (nest) {                                         // a soft pool of light around the ant
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, a.k ? 90 : 62);
    g.addColorStop(0, 'rgba(246,223,210,0.16)'); g.addColorStop(1, 'rgba(246,223,210,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, a.k ? 90 : 62, 0, 7); ctx.fill();
  }
  ctx.rotate(a.da); ctx.scale(1.35, 1.35);
  ctx.strokeStyle = nest ? 'rgba(246,223,210,0.75)' : EARTH; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  const sw = Math.sin(a.phase) * (a.p ? 0.2 : 1);
  for (let i = -1; i <= 1; i++) for (const side of [-1, 1]) {   // six legs
    const s = Math.sin(a.phase + i * 2.1 + (side > 0 ? 0 : Math.PI)) * (a.p ? 0.2 : 1);
    ctx.beginPath(); ctx.moveTo(i * 4, 0); ctx.lineTo(i * 4 + s * 3, side * 7); ctx.lineTo(i * 4 + s * 5, side * 11); ctx.stroke();
  }
  ctx.fillStyle = a.c;
  for (const [x, rx, ry] of [[-9, 6.5, 4.8], [-1, 4, 3.4], [6, 3.6, 3.2]]) {
    ctx.beginPath(); ctx.ellipse(x, 0, rx, ry, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(8.5, -1.5); ctx.quadraticCurveTo(13, -4, 15, -3); ctx.moveTo(8.5, 1.5); ctx.quadraticCurveTo(13, 4, 15, 3); ctx.stroke();
  ctx.restore();
  if (a.k) {                                           // the word it carries
    ctx.save(); ctx.globalAlpha = Math.max(0, a.al);
    ctx.font = '14px Helvetica, Arial, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = nest ? LIGHT : RED;
    ctx.fillText(a.k, a.dx + Math.cos(a.da) * 30, a.dy + Math.sin(a.da) * 30 + 4);
    ctx.restore();
  }
}

let lastT = performance.now();
function frame(tm) {
  if (!window.__stop) requestAnimationFrame(frame);
  const dt = Math.min(0.1, (tm - lastT) / 1000); lastT = tm;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // two halves that fill the whole window: the page (white) and the nest (soil)
  const midX = ox + (cfg ? cfg.split * sc : W / 2);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, midX, H);
  ctx.fillStyle = EARTH; ctx.fillRect(midX, 0, W - midX, H);
  if (!cfg) return;

  const t = now();
  for (const a of ants.values()) {                     // smooth what the server tells us
    const dist = Math.hypot(a.tx - a.dx, a.ty - a.dy);
    if (dist > 120) { a.dx = a.tx; a.dy = a.ty; a.da = a.ta; }
    else {
      const k = 1 - Math.pow(0.0008, dt);
      a.dx += (a.tx - a.dx) * k; a.dy += (a.ty - a.dy) * k;
      let d = a.ta - a.da; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
      a.da += d * k; a.phase += dist * 0.42 * (a.p ? 0.2 : 1) + dt * 0.5;
    }
  }

  ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
  ctx.beginPath(); ctx.rect(0, 0, cfg.W, cfg.H); ctx.clip();

  // the nest: soil, grain, tunnels, rooms
  ctx.save(); ctx.translate(cfg.split, 0);
  ctx.fillStyle = grain; ctx.fillRect(0, 0, cfg.W - cfg.split, cfg.H);
  ctx.drawImage(tunnelEdge, 0, 0); ctx.drawImage(tunnelFill, 0, 0);
  if (roomsDirty) drawRooms();
  ctx.drawImage(roomLayer, 0, 0);
  ctx.restore();

  drawPageWords();
  drawDots(0, t); drawDots(1, t);

  const ph = cfg.pageHole;                             // the hole in the page
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ph.x, ph.y, 24, 0, 7); ctx.fill();

  for (const a of [...ants.values()].sort((p, q) => p.dy - q.dy)) drawAnt(a);
  ctx.restore();
}

connect();
if (window.__stop) frame(performance.now()); else requestAnimationFrame(frame);
</script>
</body>
</html>
