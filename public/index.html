<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ants Playing the Web</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3f1606; touch-action: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Mouse: move your ant · Wheel: scroll the page
// Click: take a word (page) / drop the word (nest)
// The ant, its walk and the two worlds are Nouria's. Five resident ants live on the server and go
// about their business; every visitor gets an ant of their own. You only see the ants in your space.

const RED = '#7a2e12', EARTH = '#3f1606', LIGHT = '#f6dfd2';
const FONT = 'Helvetica, Arial, sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1, sc = 1, ox = 0, oy = 0;      // window, and how the world (LW x LH) fits in it

let cfg = null;                                          // layout and settings from the server
let LW = 1400, LH = 850, HOLE = { x: 1300, y: 770, r: 24 };
let texts = [], hidden = [], rooms = [];
let tunnelLayer, roomLayer, roomsDirty = true;
let scrollY = 0, pageHeight = 0;
let others = {};                                         // the other ants (bots and visitors), by id
let mx = 700, my = 425;                                  // the mouse, in world units

const MY_ID = (() => {
  try {
    let id = localStorage.getItem('antId');
    if (!id) { id = Math.random().toString(36).slice(2, 10); localStorage.setItem('antId', id); }
    return id;
  } catch (e) { return Math.random().toString(36).slice(2, 10); }
})();

// ---------- layers ----------
function layer(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function dig(x, y, r) {                                  // the nest is dug wherever an ant walks
  const g = tunnelLayer.getContext('2d');
  g.fillStyle = RED; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}
function drawRooms() {                                   // a lighter boundary around the words an ant keeps
  const g = roomLayer.getContext('2d');
  g.clearRect(0, 0, LW, LH);
  const R = cfg.roomR;
  for (const r of rooms) {
    const items = r.room.items; if (!items.length) continue;
    const t = layer(LW, LH), tx = t.getContext('2d');
    tx.fillStyle = r.c;
    for (const it of items) { tx.beginPath(); tx.arc(it.x, it.y, R + 3, 0, 7); tx.fill(); }
    tx.globalCompositeOperation = 'destination-out';
    for (const it of items) { tx.beginPath(); tx.arc(it.x, it.y, R, 0, 7); tx.fill(); }
    g.globalAlpha = 0.6; g.drawImage(t, 0, 0);           // the boundary
    const f = layer(LW, LH), fx = f.getContext('2d');
    fx.fillStyle = r.c;
    for (const it of items) { fx.beginPath(); fx.arc(it.x, it.y, R, 0, 7); fx.fill(); }
    g.globalAlpha = 0.12; g.drawImage(f, 0, 0);          // the lighter floor
    g.globalAlpha = 1;
  }
  g.fillStyle = LIGHT; g.font = '11px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const r of rooms) for (const it of r.room.items) g.fillText(it.t, it.x, it.y);
  roomsDirty = false;
}

// ---------- my ant: exactly Nouria's ----------
const ant = { x: 700, y: 425, angle: -Math.PI / 2, step: 0, space: 'web', carry: null, ready: true };
const head = a => ({ x: a.x + Math.cos(a.angle) * 8, y: a.y + Math.sin(a.angle) * 8 });

function updateAnt() {
  // turn smoothly towards the mouse and move forward
  const d = Math.hypot(mx - ant.x, my - ant.y);
  if (d > 3) {
    const target = Math.atan2(my - ant.y, mx - ant.x);
    ant.angle += Math.atan2(Math.sin(target - ant.angle), Math.cos(target - ant.angle)) * 0.25;
    const speed = Math.min(d * 0.08, 3);
    ant.x = Math.max(10, Math.min(LW - 10, ant.x + Math.cos(ant.angle) * speed));
    ant.y = Math.max(10, Math.min(LH - 10, ant.y + Math.sin(ant.angle) * speed));
    ant.step += speed * 0.5;
  }
  if (ant.space === 'nest') dig(ant.x, ant.y, 9);        // in the nest, the ant digs wherever it walks
  const dh = Math.hypot(ant.x - HOLE.x, ant.y - HOLE.y); // pass through the hole
  if (dh > HOLE.r + 6) ant.ready = true;
  if (ant.ready && dh < HOLE.r) { ant.space = ant.space === 'web' ? 'nest' : 'web'; ant.ready = false; }
}

// draws an ant (mine or someone else's): Nouria's drawing, unchanged
function drawAnt(x, y, angle, step, carry, space, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  if (carry) {                                           // the word in its mandibles
    ctx.fillStyle = space === 'web' ? RED : LIGHT; ctx.globalAlpha = alpha / 255;
    ctx.font = '10px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(carry, 10, 0);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = `rgba(17,17,17,${alpha / 255})`; ctx.lineWidth = 1;   // three strokes for the legs
  const o = Math.sin(step) * 1.5;
  ctx.beginPath();
  for (let i = -1; i <= 1; i++) { ctx.moveTo(i * 3 - o, -6); ctx.lineTo(i * 3 + o, 6); }
  ctx.stroke();
  ctx.fillStyle = `rgba(17,17,17,${alpha / 255})`;      // an oval for the body
  ctx.beginPath(); ctx.ellipse(0, 0, 7, 2.5, 0, 0, 7); ctx.fill();
  ctx.restore();
}

// ---------- the other ants ----------
function receiveTick(list) {
  const seen = {};
  for (const v of list) {
    if (v.id === MY_ID) continue;
    seen[v.id] = true;
    let o = others[v.id];
    if (!o) o = others[v.id] = { x: v.x, y: v.y, angle: v.a, step: 0, tx: v.x, ty: v.y, ta: v.a, space: v.s };
    if (o.space !== v.s) { o.x = v.x; o.y = v.y; o.angle = v.a; }
    Object.assign(o, { tx: v.x, ty: v.y, ta: v.a, space: v.s, carry: v.k });
  }
  for (const id in others) if (!seen[id]) delete others[id];
}
function updateOthers() {                                // between two messages the others glide to their last position
  for (const id in others) {
    const o = others[id];
    const nx = o.x + (o.tx - o.x) * 0.2, ny = o.y + (o.ty - o.y) * 0.2;
    o.step += Math.hypot(nx - o.x, ny - o.y) * 0.5;
    o.x = nx; o.y = ny;
    o.angle += Math.atan2(Math.sin(o.ta - o.angle), Math.cos(o.ta - o.angle)) * 0.2;
  }
}
function drawOthers(space) {                             // I only see the ants that are in the same space as me
  for (const id in others) {
    const o = others[id];
    if (o.space === space) drawAnt(o.x, o.y, o.angle, o.step, o.carry, o.space, 130);
  }
}

// ---------- the page ----------
function isHidden(i) { return !!hidden[i]; }
function wordUnderAnt() {                                // the word under my ant's head
  const h = head(ant), py = h.y + scrollY;               // the page scrolls, the ant does not
  for (let i = 0; i < cfg.words.length; i++) {
    const w = cfg.words[i];
    if (!isHidden(i) && h.x > w.x && h.x < w.x + w.w && py > w.y - w.size && py < w.y + 3) return i;
  }
  return -1;
}
function drawWeb() {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
  ctx.translate(0, -scrollY);                            // page scrolling
  ctx.fillStyle = RED; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < cfg.words.length; i++) {
    if (isHidden(i)) continue;                           // taken word: a blank remains
    const w = cfg.words[i];
    ctx.font = (w.bold ? 'bold ' : '') + w.size + 'px ' + FONT;
    ctx.fillText(texts[i], w.x, w.y, w.w + 4);
  }
  ctx.font = '13px ' + FONT; ctx.fillText(cfg.credit, 90, cfg.creditY);
  const hi = wordUnderAnt();                             // underline the word that can be taken
  if (hi >= 0 && !ant.carry) {
    const w = cfg.words[hi];
    ctx.strokeStyle = RED; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(w.x, w.y + 3); ctx.lineTo(w.x + w.w, w.y + 3); ctx.stroke();
  }
  drawOthers('web');                                     // the others, in page coordinates
  ctx.restore();
  ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(HOLE.x, HOLE.y, HOLE.r, 0, 7); ctx.fill();   // the hole does not scroll
  ctx.restore();
}
function drawNest() {
  ctx.fillStyle = EARTH; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
  ctx.drawImage(tunnelLayer, 0, 0);
  if (roomsDirty) drawRooms();
  ctx.drawImage(roomLayer, 0, 0);
  ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.arc(HOLE.x, HOLE.y, HOLE.r, 0, 7); ctx.fill();
  drawOthers('nest');
  ctx.restore();
}
function drawCounter() {
  const n = Object.keys(others).length + 1;
  ctx.fillStyle = ant.space === 'web' ? 'rgb(150,150,150)' : '#c99a86';
  ctx.font = '11px ' + FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText(n + (n > 1 ? ' ants here' : ' ant here'), W - 12, 10);
}

// ---------- the loop: 60 steps per second, whatever the screen ----------
let acc = 0, lastTm = performance.now();
function frame(tm) {
  if (!window.__still) requestAnimationFrame(frame);
  acc = Math.min(6, acc + (tm - lastTm) / 16.667); lastTm = tm;
  if (cfg) while (acc >= 1) { updateAnt(); updateOthers(); acc -= 1; }
  if (!cfg) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); return; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (ant.space === 'web') drawWeb(); else drawNest();
  ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
  drawAnt(ant.x, ant.y, ant.angle, ant.step, ant.carry, ant.space, 255);
  ctx.restore();
  drawCounter();
}

// ---------- input ----------
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  sc = Math.min(W / LW, H / LH); ox = (W - LW * sc) / 2; oy = (H - LH * sc) / 2;
}
addEventListener('resize', resize);
function setMouse(e) { mx = (e.clientX - ox) / sc; my = (e.clientY - oy) / sc; }
addEventListener('pointermove', setMouse);
addEventListener('wheel', e => {
  if (!cfg || ant.space !== 'web') return;
  e.preventDefault();
  scrollY = Math.max(0, Math.min(Math.max(0, pageHeight - LH), scrollY + e.deltaY / sc));
}, { passive: false });
function post(m) {
  return fetch('act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: MY_ID, ...m }), keepalive: true })
    .then(r => r.json()).catch(() => ({ ok: false }));
}
addEventListener('pointerdown', e => {
  setMouse(e);
  if (!cfg) return;
  if (ant.space === 'web' && !ant.carry) {
    const i = wordUnderAnt();                            // take
    if (i >= 0) post({ kind: 'take', i }).then(r => { if (r.ok) { ant.carry = r.text; hidden[i] = 1; } });
  } else if (ant.space === 'nest' && ant.carry) {
    const h = head(ant);                                 // drop
    post({ kind: 'drop', text: ant.carry, x: Math.round(h.x), y: Math.round(h.y) });
    ant.carry = null;
  }
});
// I tell the others where my ant is (on the page: position in the page, not on screen)
setInterval(() => {
  if (!cfg || document.hidden) return;
  post({ kind: 'pos', x: Math.round(ant.x), y: Math.round(ant.space === 'web' ? ant.y + scrollY : ant.y),
    a: Math.round(ant.angle * 100) / 100, s: ant.space, k: ant.carry });
}, 100);

// ---------- the server ----------
function onInit(m) {
  cfg = m; LW = m.W; LH = m.H; HOLE = m.hole; pageHeight = m.pageHeight;
  tunnelLayer = layer(LW, LH); roomLayer = layer(LW, LH);
  for (const s of m.tunnels) dig(s[0], s[1], 9);
  if (!window.__started) { window.__started = true; mx = ant.x = LW / 2; my = ant.y = LH / 2; if (location.search.includes('nest')) ant.space = 'nest'; }
  resize();
}
function onWorld(w) { texts = w.texts; hidden = w.hidden; rooms = w.rooms; roomsDirty = true; }
function onTick(m) { for (const s of m.nt) dig(s[0], s[1], 9); receiveTick(m.ants); }
function connect() {
  if (location.search.includes('still')) {               // one still picture, for screenshots
    const x = new XMLHttpRequest(); x.open('GET', 'snapshot', false); x.send();
    const m = JSON.parse(x.responseText); onInit(m.init); onWorld(m.world); onTick(m.tick);
    window.__still = true; return;
  }
  const es = new EventSource('events');
  es.addEventListener('init', e => onInit(JSON.parse(e.data)));
  es.addEventListener('world', e => onWorld(JSON.parse(e.data)));
  es.addEventListener('tick', e => onTick(JSON.parse(e.data)));
}
resize();
connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
