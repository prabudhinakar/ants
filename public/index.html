<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ants Playing the Web</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3f1606; touch-action: none; }
  canvas { display: block; }
  canvas.shake { animation: shake 0.45s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-12px); } 30% { transform: translateX(10px); } 45% { transform: translateX(-8px); } 60% { transform: translateX(6px); } 80% { transform: translateX(-3px); } }
  #bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: none; font: 14px Helvetica, Arial, sans-serif; color: #7a2e12; z-index: 5; text-align: center; }
  #bar .row { display: flex; gap: 6px; justify-content: center; }
  #bar input { width: 340px; padding: 7px 10px; border: 1px solid #7a2e12; background: #fff; color: #7a2e12; font: inherit; border-radius: 0; outline: none; }
  #bar button { padding: 7px 12px; border: 1px solid #7a2e12; background: #fff; color: #7a2e12; font: inherit; cursor: pointer; border-radius: 0; }
  #bar button:hover { background: #f6dfd2; }
  #crumbs { margin-top: 6px; font-size: 11px; color: #a0705a; }
  #crumbs span { cursor: pointer; text-decoration: underline; margin: 0 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <div class="row"><input id="q" placeholder="search the web, or paste a link" autocomplete="off" spellcheck="false"><button id="go">go</button><button id="rnd">random</button></div>
  <div id="crumbs"></div>
</div>
<script>
// Mouse: move your ant · Wheel: scroll the page · Click: take / drop / eat / buy / cross a link
// Shift: boost · S: scent mark · Q: call · F (hold): follow the nearest ant · G: give your word · M: sound
// The ant, its walk and the worlds are Nouria's. Five resident ants live on the server and go about their
// business; every visitor gets an ant of their own. You only see the ants in your own space.

const RED = '#7a2e12', EARTH = '#3f1606', LIGHT = '#f6dfd2';
const PALETTE = ['#c8553d', '#d9a441', '#d98e9a', '#f6dfd2', '#a8643a'];
const FONT = 'Helvetica, Arial, sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const barEl = document.getElementById('bar'), qEl = document.getElementById('q'), crumbsEl = document.getElementById('crumbs');
let W = 1, H = 1, DPR = 1, sc = 1, vox = 0, voy = 0, vw = 1400, vh = 850;   // window, scale, and the part of the world in view

let cfg = null, LW = 1400, LH = 850, NW = 4200, NH = 1700, HOLE = { x: 1300, y: 770, r: 24 }, PORTALS = {};
let texts = [], hidden = [], rooms = [], roomPts = [];
let tunnelLayer, roomLayer, roomsDirty = true;
let scrollY = 0, camX = 0, camY = 0, pageHeight = 0;
let others = {}, trails = [], marks = [], fxs = [];
let clockOffset = 0, roomVer = 0;
const Q = new URLSearchParams(location.search);

// ---------- what I own: tokens and my look (kept in this browser) ----------
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let MY_ID = store.get('antId', null);
if (!MY_ID) { MY_ID = Math.random().toString(36).slice(2, 10); store.set('antId', MY_ID); }
let tokens = store.get('antTokens', 0);
if (Q.get('tokens')) tokens = +Q.get('tokens') || 0;
let look = store.get('antLook', { t: null, c: null, sz: 1, gl: 0, st: 0, pt: null });
let owned = store.get('antOwned', ['type:ant', 'col:black', 'size:1']);
const saveMe = () => { store.set('antTokens', tokens); store.set('antLook', look); store.set('antOwned', owned); };

// ---------- sound (starts at the first click) ----------
let AC = null, muted = store.get('antMuted', false);
function beep(f, d, v, type, slide) {
  if (muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(v || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
const doorSound = () => { beep(140, 0.3, 0.09, 'square', 70); beep(110, 0.25, 0.07, 'sawtooth', 60); };
function closedDoor() { cv.classList.remove('shake'); void cv.offsetWidth; cv.classList.add('shake'); doorSound(); }

// ---------- layers ----------
function layer(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const DIG = [9, 12, 15];
function dig(x, y, r) { const g = tunnelLayer.getContext('2d'); g.fillStyle = RED; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function inRoom(x, y) { const R = cfg.roomR; for (const p of roomPts) if (Math.abs(p.x - x) < R && Math.abs(p.y - y) < R && Math.hypot(p.x - x, p.y - y) < R) return true; return false; }

const imgCache = new Map();
function cachedImage(src) {
  let im = imgCache.get(src);
  if (!im) { im = new Image(); im.onload = () => { roomsDirty = true; }; im.src = src; imgCache.set(src, im); }
  return im;
}
// draws a word, a cut-out word or a cut picture (carried, or stored in a room)
function drawItem(g, it, x, y, size, alpha, space) {
  if (typeof it === 'string') it = { t: it };
  g.save(); g.globalAlpha = (alpha === undefined ? 1 : alpha);
  if (it.img) {
    const im = typeof it.img === 'string' && it.img.length > 8 ? cachedImage(it.img) : null;
    const s = size > 12 ? 58 : 22;
    if (im && im.complete && im.naturalWidth) { const k = Math.min(s / im.naturalWidth, s / im.naturalHeight), w = im.naturalWidth * k, h = im.naturalHeight * k; g.drawImage(im, x - w / 2, y - h / 2, w, h); g.strokeStyle = LIGHT; g.lineWidth = 1; g.strokeRect(x - w / 2, y - h / 2, w, h); }
    else { g.fillStyle = LIGHT; g.fillRect(x - s / 4, y - s / 4, s / 2, s / 2); }
  } else {
    g.font = size + 'px ' + FONT; g.textBaseline = 'middle';
    const tw = g.measureText(it.t).width;
    if (it.bg) { g.fillStyle = it.bg; g.fillRect(x - tw / 2 - 4, y - size * 0.8, tw + 8, size * 1.6); g.strokeStyle = '#2b1004'; g.lineWidth = it.bw || 2; g.strokeRect(x - tw / 2 - 4, y - size * 0.8, tw + 8, size * 1.6); g.fillStyle = '#2b1004'; }
    else g.fillStyle = space === 'web' || space === 'B' ? RED : LIGHT;
    g.textAlign = 'center'; g.fillText(it.t, x, y);
  }
  g.restore();
}
function drawRooms() {                                   // a lighter boundary around the words an ant keeps
  const g = roomLayer.getContext('2d');
  g.clearRect(0, 0, NW, NH);
  const R = cfg.roomR;
  for (const r of rooms) {
    const items = r.room.items; if (!items.length) continue;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const it of items) { x0 = Math.min(x0, it.x); y0 = Math.min(y0, it.y); x1 = Math.max(x1, it.x); y1 = Math.max(y1, it.y); }
    x0 = Math.floor(x0 - R - 6); y0 = Math.floor(y0 - R - 6); const bw = Math.ceil(x1 - x0 + R + 6), bh = Math.ceil(y1 - y0 + R + 6);
    const paint = (rad, col, comp) => { const t = layer(bw, bh), tx = t.getContext('2d'); tx.fillStyle = col; for (const it of items) { tx.beginPath(); tx.arc(it.x - x0, it.y - y0, rad, 0, 7); tx.fill(); } return t; };
    const floor = paint(R, EARTH); g.drawImage(floor, x0, y0);                 // the room hides the tunnels under it
    const ring = paint(R + 3, r.c), rx = ring.getContext('2d'); rx.globalCompositeOperation = 'destination-out';
    for (const it of items) { rx.beginPath(); rx.arc(it.x - x0, it.y - y0, R, 0, 7); rx.fill(); }
    g.globalAlpha = 0.6; g.drawImage(ring, x0, y0);                           // the boundary
    g.globalAlpha = 0.12; g.drawImage(paint(R, r.c), x0, y0); g.globalAlpha = 1; // the lighter floor
  }
  for (const r of rooms) for (const it of r.room.items) drawItem(g, it, it.x, it.y, 11, 1, 'nest');
  roomsDirty = false;
}

// ---------- the ant: Nouria's, with what I bought ----------
const ant = { x: 700, y: 425, angle: -Math.PI / 2, step: 0, space: 'web', carry: [], ready: true };
const head = a => ({ x: a.x + Math.cos(a.angle) * 8, y: a.y + Math.sin(a.angle) * 8 });
const maxCarry = () => look.t === 'carrier' ? 2 : 1;
const nestLike = () => ant.space === 'nest';
const pageLike = () => ant.space === 'web' || ant.space === 'B';
let keys = {}, mouseDown = false, cx = 700, cy = 425, bpage = null, bhidden = new Set(), bhist = [], crop = null, giveFlash = 0;

function mouseWorld() {                                  // where the mouse is, in the space my ant lives in
  const sx = (cx - vox) / sc, sy = (cy - voy) / sc;
  return nestLike() ? { x: sx + camX, y: sy + camY } : { x: sx, y: sy };
}
const screenY = o => (o.s === 'web' || o.s === 'B') ? o.y - scrollY : o.y;      // others on a page are stored in page coordinates
function nearestOther(maxd, filter) {
  let best = null, bd = maxd;
  for (const id in others) {
    const o = others[id]; if (!sameSpace(o) || o.g || (filter && !filter(o))) continue;
    const d = Math.hypot(o.x - ant.x, screenY(o) - ant.y); if (d < bd) { bd = d; best = o; }
  }
  return best;
}
const sameSpace = o => o.s === ant.space && (ant.space !== 'B' || (bpage && o.p === bpage.key));

function updateAnt() {
  let m = mouseWorld();
  if (keys.f) { const o = nearestOther(180, o => !o.g); if (o) m = { x: o.x - Math.cos(o.angle) * 18, y: screenY(o) - Math.sin(o.angle) * 18 }; }   // follow in line
  const boost = keys.shift ? 2 : 1;
  const d = Math.hypot(m.x - ant.x, m.y - ant.y);
  if (d > 3) {
    const target = Math.atan2(m.y - ant.y, m.x - ant.x);
    ant.angle += Math.atan2(Math.sin(target - ant.angle), Math.cos(target - ant.angle)) * 0.25;
    const speed = Math.min(d * 0.08 * boost, (look.t === 'scout' ? 4.2 : 3) * boost);
    const bw = nestLike() ? NW : LW, bh = nestLike() ? NH : LH;
    ant.x = Math.max(10, Math.min(bw - 10, ant.x + Math.cos(ant.angle) * speed));
    ant.y = Math.max(10, Math.min(bh - 10, ant.y + Math.sin(ant.angle) * speed));
    ant.step += speed * 0.5;
  }
  for (const id in others) {                             // ants do not overlap
    const o = others[id]; if (!sameSpace(o) || o.g) continue;
    const dx = ant.x - o.x, dy = ant.y - screenY(o), dd = Math.hypot(dx, dy);
    if (dd < 14 && dd > 0.01) { ant.x += dx / dd * 0.9; ant.y += dy / dd * 0.9; }
    if (dd < 16 && Date.now() - (o.touched || 0) > 4000) { o.touched = Date.now(); fxs.push({ k: 'touch', s: ant.space, p: bpage ? bpage.key : '', x: ant.x, y: nestLike() ? ant.y : ant.y + (pageLike() ? scrollY : 0), t: performance.now() }); beep(900, 0.06, 0.03); }
  }
  if (nestLike()) {                                      // in the nest, the ant digs wherever it walks (not inside a room)
    if (!inRoom(ant.x, ant.y)) dig(ant.x, ant.y, look.t === 'digger' ? 15 : 9);
    camX += (Math.max(0, Math.min(NW - vw, ant.x - vw / 2)) - camX) * 0.12;
    camY += (Math.max(0, Math.min(NH - vh, ant.y - vh / 2)) - camY) * 0.12;
  }
  portals();
  if (crop && mouseDown && ant.space === 'B') { const h = head(ant), p = { x: h.x, y: h.y + scrollY }; const im = bpage.images[crop.i]; if (p.x > im.x && p.x < im.x + im.w && p.y > im.y && p.y < im.y + im.h) { crop.pts.push(p); if (crop.pts.length > 600) crop.pts.shift(); } }
}

// doors: the hole on the page / open web / market leads down; the three portals in the nest lead out
function enter(space, x, y) {
  ant.space = space; ant.x = x; ant.y = y; ant.ready = false; scrollY = 0; crop = null;
  if (space === 'nest') { camX = Math.max(0, Math.min(NW - vw, x - vw / 2)); camY = Math.max(0, Math.min(NH - vh, y - vh / 2)); }
  barEl.style.display = space === 'B' ? 'block' : 'none';
  if (space === 'B' && !bpage && !Q.get('q')) setTimeout(() => qEl.focus(), 50);
  beep(220, 0.12, 0.04, 'sine', 330);
}
let fromPortal = 'A';
function portals() {
  if (nestLike()) {
    let near = false;
    for (const k in PORTALS) {
      const p = PORTALS[k], dh = Math.hypot(ant.x - p.x, ant.y - p.y);
      if (dh < p.r + 6) near = true;
      if (ant.ready && dh < p.r) { fromPortal = k; enter(k === 'A' ? 'web' : k, HOLE.x, HOLE.y); return; }
    }
    if (!near) ant.ready = true;
  } else {
    const dh = Math.hypot(ant.x - HOLE.x, ant.y - HOLE.y);
    if (dh > HOLE.r + 6) ant.ready = true;
    if (ant.ready && dh < HOLE.r) { const k = ant.space === 'web' ? 'A' : ant.space; enter('nest', PORTALS[k].x, PORTALS[k].y); }
  }
}

// draws an ant (mine or someone else's): Nouria's drawing, with the look the owner bought
function drawAnt(x, y, angle, step, carry, space, alpha, lk) {
  lk = lk || {};
  const col = lk.c || '#111111', a = alpha / 255;
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.scale(lk.sz || 1, lk.sz || 1);
  if (lk.gl) { const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 26); g.addColorStop(0, hexA(lk.c || '#f6dfd2', 0.55 * a)); g.addColorStop(1, hexA(lk.c || '#f6dfd2', 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.fill(); }
  const items = Array.isArray(carry) ? carry : (carry ? [carry] : []);
  items.forEach((it, i) => {                             // the word in its mandibles
    ctx.save(); ctx.translate(10 + i * 0, i * 11 - (items.length - 1) * 5.5);
    if (typeof it === 'object' && (it.img || it.bg)) { ctx.rotate(0); drawItem(ctx, it, 14, 0, 10, a, space); }
    else { ctx.globalAlpha = a; ctx.fillStyle = (space === 'web' || space === 'B') ? RED : LIGHT; ctx.font = '10px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(typeof it === 'object' ? it.t : it, 0, 0); }
    ctx.restore();
  });
  ctx.strokeStyle = hexA(col, a); ctx.lineWidth = 1;     // three strokes for the legs
  const o = Math.sin(step) * 1.5;
  ctx.beginPath(); for (let i = -1; i <= 1; i++) { ctx.moveTo(i * 3 - o, -6); ctx.lineTo(i * 3 + o, 6); } ctx.stroke();
  ctx.fillStyle = hexA(col, a);                          // an oval for the body
  ctx.beginPath(); ctx.ellipse(0, 0, 7, 2.5, 0, 0, 7); ctx.fill();
  if (lk.st) { ctx.strokeStyle = hexA('#f6dfd2', a); ctx.lineWidth = 0.9; ctx.beginPath(); ctx.ellipse(0, 0, 7.8, 3.3, 0, 0, 7); ctx.stroke(); }
  if (lk.pt === 'stripes') { ctx.strokeStyle = hexA('#f6dfd2', a); ctx.lineWidth = 0.8; ctx.beginPath(); for (const x of [-3, 0, 3]) { ctx.moveTo(x, -2.2); ctx.lineTo(x, 2.2); } ctx.stroke(); }
  if (lk.pt === 'dots') { ctx.fillStyle = hexA('#f6dfd2', a); for (const x of [-3.5, 0, 3.5]) { ctx.beginPath(); ctx.arc(x, 0, 0.8, 0, 7); ctx.fill(); } }
  ctx.restore();
}
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// ---------- the other ants ----------
function receiveTick(list) {
  const seen = {};
  for (const v of list) {
    if (v.id === MY_ID) continue;
    seen[v.id] = true;
    let o = others[v.id];
    if (!o) o = others[v.id] = { x: v.x, y: v.y, angle: v.a, step: 0, tx: v.x, ty: v.y, ta: v.a, s: v.s };
    if (o.s !== v.s || v.g) { o.x = v.x; o.y = v.y; o.angle = v.a; }
    Object.assign(o, { tx: v.x, ty: v.y, ta: v.a, s: v.s, p: v.p || '', carry: v.k, look: v.l, g: v.g });
  }
  for (const id in others) if (!seen[id]) delete others[id];
}
let stepSnd = 0;
function updateOthers() {                                // between two messages the others glide to their last position
  for (const id in others) {
    const o = others[id];
    const nx = o.x + (o.tx - o.x) * 0.2, ny = o.y + (o.ty - o.y) * 0.2, mv = Math.hypot(nx - o.x, ny - o.y);
    o.step += mv * 0.5; o.x = nx; o.y = ny;
    o.angle += Math.atan2(Math.sin(o.ta - o.angle), Math.cos(o.ta - o.angle)) * 0.2;
    if (mv > 0.8 && !o.g && sameSpace(o) && AC && performance.now() - (o.snd || 0) > 380) {      // footsteps: louder the nearer
      const d = Math.hypot(o.x - ant.x, screenY(o) - ant.y);
      if (d < 420) { o.snd = performance.now(); beep(110 + (id.charCodeAt(id.length - 1) % 7) * 12, 0.05, 0.035 * (1 - d / 420), 'triangle'); }
    }
  }
}
function drawOthers(space) {                             // I only see the ants that are in the same space as me
  for (const id in others) {
    const o = others[id];
    if (o.s === space && (space !== 'B' || (bpage && o.p === bpage.key))) drawAnt(o.x, o.y, o.angle, o.step, o.carry, o.s, o.g ? 55 : 130, o.look);
  }
}

// ---------- the main page ----------
function wordUnderAnt(list, skipHidden) {                // the word under my ant's head
  const h = head(ant), py = h.y + scrollY;               // the page scrolls, the ant does not
  for (let i = 0; i < list.length; i++) {
    const w = list[i];
    if (skipHidden(i)) continue;
    if (h.x > w.x && h.x < w.x + w.w && py > w.y - w.size && py < w.y + 3) return i;
  }
  return -1;
}
function drawWordList(list, textOf, hide) {
  ctx.fillStyle = RED; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < list.length; i++) {
    if (hide(i)) continue;                               // taken word: a blank remains
    const w = list[i];
    ctx.font = (w.bold ? 'bold ' : '') + w.size + 'px ' + FONT;
    ctx.fillText(textOf(i), w.x, w.y, w.w + 4);
    if (w.q) { ctx.strokeStyle = RED; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(w.x, w.y + 3); ctx.lineTo(w.x + w.w, w.y + 3); ctx.stroke(); }
  }
}
function drawDots(sp, t) {                               // walking trails (10 minutes), not inside rooms
  for (const d of trails) {
    if (d[3] !== sp) continue;
    const k = 1 - (t - d[2]) / cfg.trailTtl; if (k <= 0) continue;
    if (sp === 1) { if (d[5] !== roomVer) { d[4] = inRoom(d[0], d[1]); d[5] = roomVer; } if (d[4]) continue; }
    ctx.fillStyle = sp ? `rgba(246,223,210,${0.3 * k})` : `rgba(122,46,18,${0.3 * k})`;
    ctx.beginPath(); ctx.arc(d[0], d[1], 2, 0, 7); ctx.fill();
  }
  for (const d of marks) {                               // scent marks (one hour)
    if (d[3] !== sp) continue;
    const k = 1 - (t - d[2]) / cfg.scentTtl; if (k <= 0) continue;
    ctx.globalAlpha = 0.75 * k; ctx.fillStyle = d[4]; ctx.beginPath(); ctx.arc(d[0], d[1], 4.5, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.5 * k; ctx.strokeStyle = d[4]; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(d[0], d[1], 8, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function drawFx(space, offY) {
  const now = performance.now();
  fxs = fxs.filter(f => now - f.t < 1400);
  for (const f of fxs) {
    if (f.s !== space || (space === 'B' && f.p !== (bpage ? bpage.key : ''))) continue;
    const k = (now - f.t) / (f.k === 'pulse' ? 1400 : 600), y = f.y - offY;
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k);
    ctx.strokeStyle = space === 'web' || space === 'B' ? RED : LIGHT; ctx.lineWidth = 1.5;
    if (f.k === 'touch') { ctx.beginPath(); ctx.moveTo(f.x - 6, y - 6 - k * 6); ctx.lineTo(f.x - 2, y - 2); ctx.moveTo(f.x + 6, y - 6 - k * 6); ctx.lineTo(f.x + 2, y - 2); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(f.x, y, 8 + k * (f.k === 'pulse' ? 90 : 26), 0, 7); ctx.stroke(); }
    ctx.restore();
  }
}
function drawWeb() {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(vox, voy); ctx.scale(sc, sc); ctx.translate(0, -scrollY);
  const t = Date.now() + clockOffset;
  drawDots(0, t);
  drawWordList(cfg.words, i => texts[i], i => hidden[i]);
  ctx.font = '13px ' + FONT; ctx.fillStyle = RED; ctx.textAlign = 'left'; ctx.fillText(cfg.credit, 90, cfg.creditY);
  const hi = wordUnderAnt(cfg.words, i => hidden[i]);    // underline the word that can be taken
  if (hi >= 0 && ant.carry.length < maxCarry()) { const w = cfg.words[hi]; ctx.strokeStyle = RED; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(w.x, w.y + 3); ctx.lineTo(w.x + w.w, w.y + 3); ctx.stroke(); }
  drawOthers('web'); drawFx('web', 0);
  ctx.restore();
  ctx.save(); ctx.translate(vox, voy); ctx.scale(sc, sc);
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(HOLE.x, HOLE.y, HOLE.r, 0, 7); ctx.fill();   // the hole does not scroll
  ctx.restore();
}

// ---------- portal B: the open web ----------
function drawOpenWeb() {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(vox, voy); ctx.scale(sc, sc); ctx.translate(0, -scrollY);
  if (bpage) {
    drawWordList(bpage.words, i => bpage.words[i].t0, i => bhidden.has(i));
    for (const im of bpage.images) {
      if (im.el.complete && im.el.naturalWidth) ctx.drawImage(im.el, im.x, im.y, im.w, im.h); else { ctx.fillStyle = '#f3ebe6'; ctx.fillRect(im.x, im.y, im.w, im.h); }
      ctx.strokeStyle = '#e5d3c8'; ctx.lineWidth = 1; ctx.strokeRect(im.x, im.y, im.w, im.h);
    }
    const hi = wordUnderAnt(bpage.words, i => bhidden.has(i));
    if (hi >= 0) { const w = bpage.words[hi]; ctx.strokeStyle = RED; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(w.x, w.y + 3); ctx.lineTo(w.x + w.w, w.y + 3); ctx.stroke(); }
    if (crop && crop.pts.length > 1) {                   // the loop the ant draws over a picture
      ctx.strokeStyle = RED; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]); ctx.beginPath();
      crop.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  drawOthers('B'); drawFx('B', 0);
  ctx.restore();
  ctx.save(); ctx.translate(vox, voy); ctx.scale(sc, sc);
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(HOLE.x, HOLE.y, HOLE.r, 0, 7); ctx.fill();
  ctx.restore();
}
function showCrumbs() {
  crumbsEl.innerHTML = '';
  bhist.slice(-6).forEach((h, i, arr) => { const s = document.createElement('span'); s.textContent = h.title; s.onclick = () => loadPage(h.q, true); crumbsEl.appendChild(s); if (i < arr.length - 1) crumbsEl.appendChild(document.createTextNode('›')); });
}
let loading = false;
function loadPage(q, noHist) {
  if (Q.has('sync') && !bpage) {                           // test hook: open the first page before the page finishes loading
    const x = new XMLHttpRequest(); x.open('GET', 'api/web?q=' + encodeURIComponent(q || ''), false); x.send();
    const p = JSON.parse(x.responseText); p.images.forEach(im => { im.el = new Image(); im.el.src = im.u; });
    bpage = p; bhist.push({ q, title: p.title }); showCrumbs(); return;
  }
  if (loading) return; loading = true; qEl.placeholder = 'opening…';
  fetch('api/web?q=' + encodeURIComponent(q || '')).then(r => { if (!r.ok) throw 0; return r.json(); }).then(p => {
    p.images.forEach(im => { im.el = new Image(); im.el.src = im.u; });
    bpage = p; bhidden = new Set(); scrollY = 0; crop = null;
    if (!noHist) { bhist.push({ q, title: p.title }); }
    showCrumbs(); qEl.value = ''; qEl.placeholder = 'search the web, or paste a link';
  }).catch(() => { closedDoor(); qEl.placeholder = 'search the web, or paste a link'; }).finally(() => { loading = false; });
}
document.getElementById('go').onclick = () => { if (qEl.value.trim()) loadPage(qEl.value.trim()); };
document.getElementById('rnd').onclick = () => loadPage('');
qEl.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && qEl.value.trim()) loadPage(qEl.value.trim()); });

function doCrop() {                                      // the loop is closed: cut the picture inside it
  const c = crop; crop = null;
  if (!c || c.pts.length < 12) return;
  const im = bpage.images[c.i];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of c.pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  x0 = Math.max(x0, im.x); y0 = Math.max(y0, im.y); x1 = Math.min(x1, im.x + im.w); y1 = Math.min(y1, im.y + im.h);
  if (x1 - x0 < 28 || y1 - y0 < 28 || !im.el.naturalWidth) { closedDoor(); return; }
  const k = im.el.naturalWidth / im.w, out = Math.min(1, 120 / Math.max(x1 - x0, y1 - y0));
  const cv2 = layer(Math.round((x1 - x0) * out), Math.round((y1 - y0) * out)), g = cv2.getContext('2d');
  try { g.drawImage(im.el, (x0 - im.x) * k, (y0 - im.y) * k, (x1 - x0) * k, (y1 - y0) * k, 0, 0, cv2.width, cv2.height); } catch (e) { closedDoor(); return; }
  let url = cv2.toDataURL('image/jpeg', 0.6); if (url.length > 19000) url = cv2.toDataURL('image/jpeg', 0.4);
  if (url.length > 19000 || ant.carry.length >= maxCarry()) { closedDoor(); return; }
  ant.carry.push({ img: url }); beep(520, 0.1, 0.05, 'triangle', 780);
}

// ---------- the nest ----------
function drawNest() {
  ctx.fillStyle = EARTH; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.scale(sc, sc); ctx.translate(-camX, -camY);
  const sx = Math.max(0, camX), sy = Math.max(0, camY), sw = Math.min(NW - sx, vw + 2), sh = Math.min(NH - sy, vh + 2);
  ctx.drawImage(tunnelLayer, sx, sy, sw, sh, sx, sy, sw, sh);
  if (roomsDirty) { drawRooms(); }
  ctx.drawImage(roomLayer, sx, sy, sw, sh, sx, sy, sw, sh);
  drawDots(1, Date.now() + clockOffset);
  for (const k in PORTALS) {                             // the three fixed doors, each with its own glow
    const p = PORTALS[k], g = ctx.createRadialGradient(p.x, p.y, p.r * 0.5, p.x, p.y, p.r * 3.2);
    g.addColorStop(0, hexA(p.c, 0.45)); g.addColorStop(1, hexA(p.c, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  drawOthers('nest'); drawFx('nest', 0);
  ctx.restore();
  drawArrows();
}
function drawArrows() {                                  // small arrows at the edge point to doors and to my rooms that are out of view
  const targets = Object.entries(PORTALS).map(([k, p]) => ({ x: p.x, y: p.y, c: p.c, fill: true }));
  const mine = rooms.filter(r => r.o === MY_ID && r.room.items.length).map(r => ({ x: r.room.cx, y: r.room.cy, c: r.c, fill: false }));
  mine.sort((a, b) => Math.hypot(a.x - ant.x, a.y - ant.y) - Math.hypot(b.x - ant.x, b.y - ant.y));
  targets.push(...mine.slice(0, 2));
  ctx.save(); ctx.scale(sc, sc);
  for (const t of targets) {
    const px = t.x - camX, py = t.y - camY;
    if (px > 30 && px < vw - 30 && py > 30 && py < vh - 30) continue;
    const cxv = vw / 2, cyv = vh / 2, dx = px - cxv, dy = py - cyv;
    const k = Math.min((cxv - 34) / Math.abs(dx || 1e-9), (cyv - 34) / Math.abs(dy || 1e-9));
    const ax = cxv + dx * k, ay = cyv + dy * k, ang = Math.atan2(dy, dx);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-7, -8); ctx.lineTo(-3, 0); ctx.lineTo(-7, 8); ctx.closePath();
    if (t.fill) { ctx.fillStyle = hexA(t.c, 0.9); ctx.fill(); } else { ctx.strokeStyle = t.c; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
}

// ---------- portal C: the marketplace ----------
const SHOP = [];
(function () {
  const add = (id, label, price, x, y, kind, val) => SHOP.push({ id, label, price, x, y, kind, val });
  add('type:ant', 'ant', 0, 330, 230, 'type', null); add('type:scout', 'scout', 30, 560, 230, 'type', 'scout');
  add('type:carrier', 'carrier', 30, 790, 230, 'type', 'carrier'); add('type:digger', 'digger', 30, 1020, 230, 'type', 'digger');
  const cols = [['black', null, 0], ...PALETTE.map((c, i) => ['p' + i, c, 5]), ['teal', '#2a9d8f', 8], ['violet', '#9b5de5', 8], ['blue', '#00bbf9', 8], ['lime', '#9ef01a', 8], ['pink', '#f15bb5', 8]];
  cols.forEach((c, i) => add('col:' + c[0], c[2] ? c[2] + '' : 'free', c[2], 190 + i * 92, 440, 'col', c[1]));
  add('size:0.8', 'small', 5, 330, 640, 'size', 0.8); add('size:1', 'normal', 0, 480, 640, 'size', 1); add('size:1.45', 'large', 5, 630, 640, 'size', 1.45);
  add('glow', 'glow', 10, 820, 640, 'gl', 1); add('stroke', 'stroke', 10, 970, 640, 'st', 1);
  add('pat:stripes', 'stripes', 10, 1120, 640, 'pt', 'stripes'); add('pat:dots', 'dots', 10, 1260, 640, 'pt', 'dots');
})();
const equipped = it => it.kind === 'type' ? look.t === it.val : it.kind === 'col' ? look.c === it.val : it.kind === 'size' ? look.sz === it.val : it.kind === 'gl' ? !!look.gl : it.kind === 'st' ? !!look.st : look.pt === it.val;
function shopItemUnderAnt() { const h = head(ant); return SHOP.find(it => Math.hypot(it.x - h.x, it.y - h.y) < 34); }
function buy(it) {
  if (!owned.includes(it.id)) {
    if (tokens < it.price) { closedDoor(); return; }          // not enough tokens: shake and the closed-door sound
    tokens -= it.price; owned.push(it.id); beep(660, 0.12, 0.06, 'triangle', 990);
  }
  if (it.kind === 'type') look.t = it.val; else if (it.kind === 'col') look.c = it.val; else if (it.kind === 'size') look.sz = it.val;
  else if (it.kind === 'gl') look.gl = look.gl ? 0 : 1; else if (it.kind === 'st') look.st = look.st ? 0 : 1; else if (it.kind === 'pt') look.pt = look.pt === it.val ? null : it.val;
  saveMe();
}
function drawMarket() {
  ctx.fillStyle = '#2a1608'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(vox, voy); ctx.scale(sc, sc);
  ctx.strokeStyle = 'rgba(224,160,64,0.25)'; ctx.lineWidth = 1;
  for (const y of [330, 540, 760]) { ctx.beginPath(); ctx.moveTo(120, y); ctx.lineTo(1280, y); ctx.stroke(); }   // the three stalls
  const under = shopItemUnderAnt();
  for (const it of SHOP) {
    const own = owned.includes(it.id), on = equipped(it);
    if (it.kind === 'col') { ctx.fillStyle = it.val || '#111'; ctx.beginPath(); ctx.arc(it.x, it.y, 16, 0, 7); ctx.fill(); ctx.strokeStyle = LIGHT; ctx.lineWidth = 0.8; ctx.stroke(); }
    else {
      const lk = it.kind === 'type' ? { t: it.val, c: look.c, sz: 2.2 } : it.kind === 'size' ? { sz: it.val * 2.2, c: look.c } : it.kind === 'gl' ? { gl: 1, sz: 2.2, c: look.c } : it.kind === 'st' ? { st: 1, sz: 2.2, c: look.c } : { pt: it.val, sz: 2.2, c: look.c || '#555555' };
      if (!lk.c) lk.c = '#c99a86';
      drawAnt(it.x, it.y, -Math.PI / 2, 0, null, 'C', 255, { ...lk, c: lk.c === '#111111' ? '#c99a86' : lk.c });
    }
    if (on) { ctx.strokeStyle = '#e0a040'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(it.x, it.y, 26, 0, 7); ctx.stroke(); }
    if (under === it) { ctx.strokeStyle = LIGHT; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(it.x, it.y, 32, 0, 7); ctx.stroke(); }
    ctx.fillStyle = own ? 'rgba(246,223,210,0.55)' : LIGHT; ctx.font = '11px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(it.kind === 'col' ? (own ? '' : it.label) : it.label + (it.price && !own ? ' · ' + it.price : ''), it.x, it.y + 44);
  }
  drawOthers('C'); drawFx('C', 0);
  ctx.fillStyle = '#e0a040'; ctx.beginPath(); ctx.arc(HOLE.x, HOLE.y, HOLE.r, 0, 7); ctx.fill();
  ctx.restore();
}

// ---------- the screen furniture ----------
function drawHud() {
  const here = Object.values(others).filter(o => !o.g && sameSpace(o)).length + 1;
  const dark = nestLike() || ant.space === 'C';
  ctx.font = '11px ' + FONT; ctx.textBaseline = 'top';
  ctx.fillStyle = !dark ? 'rgb(150,150,150)' : '#c99a86'; ctx.textAlign = 'right';
  ctx.fillText(here + (here > 1 ? ' ants here' : ' ant here'), W - 12, 10);
  ctx.textAlign = 'left'; ctx.fillText(tokens + (tokens === 1 ? ' token' : ' tokens'), 12, 10);
  const away = { web: 0, nest: 0, B: 0, C: 0 };
  for (const o of Object.values(others)) if (!o.g && !sameSpace(o)) away[o.s]++;
  const names = { web: 'page', nest: 'nest', B: 'open web', C: 'market' };
  const parts = Object.keys(away).filter(k => away[k]).map(k => names[k] + ' ' + away[k]);
  if (parts.length) { ctx.textBaseline = 'bottom'; ctx.fillText('elsewhere: ' + parts.join(' · '), 12, H - 10); }
  if (performance.now() < 25000) { ctx.textAlign = 'center'; ctx.globalAlpha = Math.min(1, (25000 - performance.now()) / 4000); ctx.textBaseline = 'bottom'; ctx.fillText('click: take · drop · eat · buy      shift: boost      S: scent      Q: call      F: follow      G: give      M: sound', W / 2, H - 10); ctx.globalAlpha = 1; }
}

// ---------- the loop: 60 steps per second, whatever the screen ----------
let acc = 0, lastTm = performance.now();
function frame(tm) {
  if (!window.__still) requestAnimationFrame(frame);
  acc = Math.min(6, acc + (tm - lastTm) / 16.667); lastTm = tm;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!cfg) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); return; }
  if (nestLike()) { vox = 0; voy = 0; vw = W / sc; vh = H / sc; } else { vox = (W - LW * sc) / 2; voy = (H - LH * sc) / 2; vw = LW; vh = LH; }
  while (acc >= 1) { updateAnt(); updateOthers(); acc -= 1; }
  const sp = ant.space;
  if (sp === 'web') drawWeb(); else if (sp === 'nest') drawNest(); else if (sp === 'B') drawOpenWeb(); else drawMarket();
  ctx.save(); ctx.translate(vox, voy); ctx.scale(sc, sc);
  if (nestLike()) ctx.translate(-camX, -camY);
  drawAnt(ant.x, ant.y, ant.angle, ant.step, ant.carry, sp, 255, look);
  ctx.restore();
  drawHud();
}

// ---------- input ----------
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  sc = Math.min(W / LW, H / LH);
}
addEventListener('resize', resize);
addEventListener('pointermove', e => { cx = e.clientX; cy = e.clientY; });
addEventListener('wheel', e => {
  if (!cfg || !pageLike()) return;
  e.preventDefault();
  const ph = ant.space === 'B' ? (bpage ? bpage.pageHeight : LH) : pageHeight;
  scrollY = Math.max(0, Math.min(Math.max(0, ph - LH), scrollY + e.deltaY / sc));
}, { passive: false });
function post(m) {
  return fetch('act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: MY_ID, ...m }), keepalive: true })
    .then(r => r.json()).catch(() => ({ ok: false }));
}
function earn() { tokens++; saveMe(); beep(500, 0.07, 0.04, 'triangle'); }
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('#bar')) return;
  cx = e.clientX; cy = e.clientY; mouseDown = true;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if (!cfg) return;
  const full = ant.carry.length >= maxCarry();
  if (ant.space === 'web') {
    const i = wordUnderAnt(cfg.words, i => hidden[i]);                         // take
    if (i >= 0 && !full) post({ kind: 'take', i }).then(r => { if (r.ok) { ant.carry.push({ t: r.text }); hidden[i] = 1; earn(); } });
  } else if (ant.space === 'B' && bpage) {
    const i = wordUnderAnt(bpage.words, i => bhidden.has(i));
    if (i >= 0) {
      const w = bpage.words[i];
      if (w.q) loadPage(w.q);                                                  // a link is a portal
      else if (!full) { bhidden.add(i); ant.carry.push({ t: w.t0, bg: PALETTE[Math.floor(Math.random() * 5)], bw: 1 + Math.floor(Math.random() * 4) }); earn(); }   // a cut-out word: a background with a random border
    } else {
      const h = head(ant), py = h.y + scrollY;
      const k = bpage.images.findIndex(im => h.x > im.x && h.x < im.x + im.w && py > im.y && py < im.y + im.h);
      if (k >= 0) crop = { i: k, pts: [{ x: h.x, y: py }] };                   // circle over a picture to cut it
    }
  } else if (ant.space === 'nest') {
    const h = head(ant);
    if (ant.carry.length) { const item = ant.carry.pop(); post({ kind: 'drop', item, x: Math.round(h.x), y: Math.round(h.y) }); }   // drop
    else post({ kind: 'eat', x: Math.round(h.x), y: Math.round(h.y) }).then(r => { if (r.ok) beep(300, 0.12, 0.05, 'sawtooth', 120); });   // eat what I stored
  } else if (ant.space === 'C') {
    const it = shopItemUnderAnt(); if (it) buy(it);
  }
});
addEventListener('pointerup', () => { mouseDown = false; if (crop) doCrop(); });
addEventListener('keydown', e => {
  if (document.activeElement === qEl) return;
  const k = e.key.toLowerCase();
  if (k === 'shift') keys.shift = true;
  if (e.repeat) return;
  if (k === 'f') keys.f = true;
  if (!cfg) return;
  if (k === 'm') { muted = !muted; store.set('antMuted', muted); }
  if (k === 's' && (ant.space === 'web' || ant.space === 'nest')) { const y = ant.space === 'web' ? ant.y + scrollY : ant.y; post({ kind: 'mark', x: Math.round(ant.x), y: Math.round(y), s: ant.space }); beep(700, 0.08, 0.03); }
  if (k === 'q') { post({ kind: 'pulse', s: ant.space }); fxs.push({ k: 'pulse', s: ant.space, p: bpage ? bpage.key : '', x: ant.x, y: pageLike() ? ant.y + scrollY : ant.y, t: performance.now() }); beep(260, 0.5, 0.05, 'sine', 420); }
  if (k === 'g' && ant.carry.length) {                                          // pass the word on to the nearest visitor
    const o = nearestOther(70, o => !o.g && !String(Object.keys(others).find(id => others[id] === o)).startsWith('bot') && !o.carry);
    const id = o && Object.keys(others).find(i => others[i] === o);
    if (id) { const item = ant.carry[ant.carry.length - 1]; post({ kind: 'give', to: id, item }).then(r => { if (r.ok) { ant.carry.pop(); beep(600, 0.1, 0.05, 'triangle', 900); } }); }
  }
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === 'shift') keys.shift = false; if (k === 'f') keys.f = false; });
addEventListener('blur', () => { keys = {}; mouseDown = false; });

// I tell the others where my ant is (on a page: position in the page, not on screen)
setInterval(() => {
  if (!cfg || document.hidden) return;
  post({ kind: 'pos', x: Math.round(ant.x), y: Math.round(pageLike() ? ant.y + scrollY : ant.y), a: Math.round(ant.angle * 100) / 100, s: ant.space,
    p: ant.space === 'B' && bpage ? bpage.key : '', k: ant.carry.length ? ant.carry : null, look }).then(r => {
    if (r && r.inbox) for (const it of r.inbox) if (ant.carry.length < maxCarry()) { ant.carry.push(it); beep(800, 0.12, 0.05, 'triangle', 1200); }
  });
}, 100);

// ---------- the server ----------
function onInit(m) {
  cfg = m; LW = m.W; LH = m.H; NW = m.NW; NH = m.NH; HOLE = m.hole; PORTALS = m.portals; pageHeight = m.pageHeight;
  clockOffset = m.t - Date.now();
  tunnelLayer = layer(NW, NH); roomLayer = layer(NW, NH);
  for (const s of m.tunnels) dig(s[0], s[1], DIG[s[2] || 0]);
  trails = m.trails; marks = m.marks;
  if (!window.__started) {
    window.__started = true; ant.x = LW / 2; ant.y = LH / 2; cx = W / 2; cy = H / 2;
    const at = Q.get('at');
    if (at === 'nest') enter('nest', PORTALS.A.x + 120, PORTALS.A.y - 60);
    else if (at === 'nestb') enter('nest', PORTALS.B.x + 200, PORTALS.B.y + 100);
    else if (at === 'C') enter('C', 700, 500);
    else if (at === 'B') { enter('B', 700, 425); loadPage(Q.get('q') || ''); }
  }
  resize();
}
function onWorld(w) {
  texts = w.texts; hidden = w.hidden; rooms = w.rooms; roomsDirty = true; roomVer++;
  roomPts = []; for (const r of rooms) for (const it of r.room.items) roomPts.push(it);
}
function onTick(m) {
  clockOffset = m.t - Date.now();
  for (const s of m.nt) dig(s[0], s[1], DIG[s[2] || 0]);
  trails.push(...m.ntr); marks.push(...m.nm);
  const cut = Date.now() + clockOffset - cfg.trailTtl; while (trails.length && trails[0][2] < cut) trails.shift();
  for (const f of m.fx) fxs.push({ ...f, t: performance.now() });
  receiveTick(m.ants);
}
function connect() {
  if (Q.has('still')) {                                  // one still picture, for screenshots
    const x = new XMLHttpRequest(); x.open('GET', 'snapshot', false); x.send();
    const m = JSON.parse(x.responseText); onInit(m.init); onWorld(m.world); onTick(m.tick);
    window.__still = true; return;
  }
  const es = new EventSource('events');
  es.addEventListener('init', e => onInit(JSON.parse(e.data)));
  es.addEventListener('world', e => onWorld(JSON.parse(e.data)));
  es.addEventListener('tick', e => onTick(JSON.parse(e.data)));
}
resize();
connect();
requestAnimationFrame(frame);
</script>
